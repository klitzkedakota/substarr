# Cloudflare Configuration for substarr
name = "substarr"
compatibility_date = "2026-10-01"

# Pages configuration (if deployed via Cloudflare Pages)
pages_build_output_dir = "dist"

# Workers Static Assets configuration (if deployed via Cloudflare Workers / Workers Builds)
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"

# Build trigger for wrangler deploy
[build]
command = "npm run build"
