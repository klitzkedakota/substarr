# Cloudflare Pages configuration for substarr
#
# NOTE: A Pages config file only supports a small set of keys. Workers-only
# sections ([build], [assets], etc.) cause the deploy to fail validation with
# `Configuration file for Pages projects does not support "..."`.
# The build command and output directory are configured in the Pages dashboard
# (Build command: `npm run build`, Build output directory: `dist`).
name = "substarr"
compatibility_date = "2026-10-01"
pages_build_output_dir = "dist"
